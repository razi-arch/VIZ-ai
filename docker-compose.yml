version: '3.8'

services:
  # Database Service
  postgres-db:
    image: postgres:15-alpine
    container_name: vizai-postgres
    restart: always
    environment:
      POSTGRES_USER: vizai_admin
      POSTGRES_PASSWORD: vizai_password
      POSTGRES_DB: vizai_camera_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  # ---------------------------------------------------------------------------
  # Simulation Layer: Synthetic RTSP Test Feeds (FFmpeg)
  # NOTE FOR PRODUCTION / VPC:
  # When actual physical cameras or NVRs (Hikvision, Dahua, etc.) are connected,
  # these two containers can be stopped or commented out. MediaMTX natively pulls
  # live streams directly from physical camera RTSP addresses via its Control API.
  # ---------------------------------------------------------------------------
  stream-generator-a:
    image: jrottenberg/ffmpeg:4.4-alpine
    container_name: stream-generator-a
    restart: always
    links:
      - "mediamtx-pbt-a:mediamtx-a"
    depends_on:
      - mediamtx-pbt-a
    command: -re -f lavfi -i testsrc=size=1280x720:rate=30 -c:v libx264 -preset ultrafast -tune zerolatency -f rtsp rtsp://mediamtx-a:8554/cam1_main

  stream-generator-b:
    image: jrottenberg/ffmpeg:4.4-alpine
    container_name: stream-generator-b
    restart: always
    links:
      - "mediamtx-pbt-b:mediamtx-b"
    depends_on:
      - mediamtx-pbt-b
    command: -re -f lavfi -i testsrc=size=1280x720:rate=30 -c:v libx264 -preset ultrafast -tune zerolatency -f rtsp rtsp://mediamtx-b:8555/cam2_main

  # Streaming Node A
  mediamtx-pbt-a:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx-pbt-a
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
        aliases:
          - mediamtx-a
    ports:
      - "8554:8554"       # RTSP
      - "8888:8888"       # HLS
      - "8889:8889"       # WebRTC HTTP
      - "8189:8189/udp"   # WebRTC UDP Media
      - "9997:9997"       # MediaMTX API
    volumes:
      - ./mediamtx-a.yml:/mediamtx.yml:ro

  # Streaming Node B
  mediamtx-pbt-b:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx-pbt-b
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
        aliases:
          - mediamtx-b
    ports:
      - "8555:8555"       # RTSP
      - "8887:8887"       # HLS
      - "8890:8890"       # WebRTC HTTP
      - "8190:8190/udp"   # WebRTC UDP Media
      - "9996:9997"       # MediaMTX API
    volumes:
      - ./mediamtx-b.yml:/mediamtx.yml:ro

volumes:
  pgdata: